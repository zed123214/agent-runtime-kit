name: CI

on:
  push:
  pull_request:

jobs:
  base:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install base dependencies
        run: uv sync --frozen --dev

      - name: Verify base imports without Graph extra
        run: |
          uv run python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("langgraph") is None

          import agent_runtime
          import agent_runtime.cli.main
          import agent_runtime.tui.app
          from agent_runtime.core.app import CoreApp

          assert agent_runtime is not None
          assert CoreApp is not None
          PY

      - name: Optional dependency contract
        run: uv run pytest tests/unit/test_graph_optional_dependency.py -v

      - name: Base tests
        run: uv run pytest tests/ -m "not graph and not integration" -v

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Ruff
        run: uv run ruff check src tests scripts examples/graph_offline_demo.py

      - name: Format check
        run: uv run ruff format --check src tests scripts examples/graph_offline_demo.py

      - name: Mypy
        run: uv run mypy src

      - name: Tests
        run: uv run pytest tests/ -v

      - name: Wire protocol check
        run: uv run python scripts/check_wire_protocol.py --check

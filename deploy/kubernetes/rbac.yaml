apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentrt-core
  namespace: kitagent-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentrt-sandbox-manager
  namespace: kitagent-sandboxes
rules:
  - apiGroups: [""]
    resources: [pods, services, secrets]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentrt-sandbox-manager
  namespace: kitagent-sandboxes
subjects:
  - kind: ServiceAccount
    name: agentrt-core
    namespace: kitagent-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentrt-sandbox-manager
